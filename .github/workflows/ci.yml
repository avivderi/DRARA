name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: drara_test
          POSTGRES_USER: drara
          POSTGRES_PASSWORD: drara_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

      - name: Install dependencies
        run: npm ci

      - name: Generate test RSA keys
        run: |
          mkdir -p apps/api/keys
          openssl genrsa -out apps/api/keys/private.pem 4096
          openssl rsa -in apps/api/keys/private.pem -pubout -out apps/api/keys/public.pem

      - name: Run DB Migrations
        run: npm run db:migrate --workspace=apps/api
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: drara_test
          DB_USER: drara
          DB_PASSWORD: drara_test_password

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: drara_test
          DB_USER: drara
          DB_PASSWORD: drara_test_password
          REDIS_URL: redis://localhost:6379
          JWT_PRIVATE_KEY_PATH: ./keys/private.pem
          JWT_PUBLIC_KEY_PATH: ./keys/public.pem
          LOG_LEVEL: silent
